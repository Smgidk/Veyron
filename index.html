<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veyron</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05070d;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #05070d;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
            z-index: 9999;
        }
    </style>
</head>

<body>
    <div id="loading">Loading Veyron...</div>

    <script type="module">
        import init from "./pkg/veyron_engine.js";

        try {
            await init();

            const loading = document.getElementById("loading");
            if (loading) {
                loading.remove();
            }
        } catch (error) {
            console.error(error);

            const loading = document.getElementById("loading");

            if (loading) {
                loading.textContent =
                    "Veyron failed to start. Check the browser console.";
            }
        }
    </script>
</body>
</html>
